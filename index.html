<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Trick the Troll</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}.intro,.reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.intro{z-index:2;background:#000;transition:opacity .85s ease,visibility .85s ease;gap:8px;padding:18px}
.intro img{width:min(90vw,780px);max-height:calc(100dvh - 135px);object-fit:contain;filter:drop-shadow(0 0 18px #1000b544)}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
button{cursor:pointer;background:#1600bd;color:#fff;border:2px solid white;border-radius:10px;padding:16px 25px;font-size:clamp(16px,3vw,21px);font-weight:800;box-shadow:0 0 20px #1e00e966}
button:hover{background:#3925ed}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.hint{color:#aaa;font-size:13px;text-align:center;margin:4px 0 0}
.reveal{opacity:0;transition:opacity .85s ease;pointer-events:none;padding:12px;gap:18px}.reveal.show{opacity:1;pointer-events:auto}
.player{width:min(95vw,1100px);max-height:calc(100dvh - 95px);aspect-ratio:16/9;background:#080808;box-shadow:0 0 55px #1400b055;position:relative}
iframe{border:0;width:100%;height:100%}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.controls button{padding:10px 18px;font-size:15px}.video-link{color:#ddd;text-align:center;font-size:14px}.video-link a{color:#fff}
@media(prefers-reduced-motion:reduce){.intro,.reveal{transition:none}}
</style>
</head>
<body>
<section class="intro" id="intro" aria-label="Trick the Troll introduction">
  <img src="logo.png" alt="Trick the Troll">
  <button type="button" id="sound">🔊 TURN SOUND ON</button>
  <p class="hint">Tap to enter • sound enabled</p>
</section>
<section class="reveal" id="reveal" aria-label="Surprise video">
  <div class="player" id="player"></div>
  <div class="controls">
    <button id="next" type="button">🎲 ANOTHER MEME</button>
    <div class="video-link">Video not playing? <a id="fallback" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">Watch on YouTube ↗</a></div>
  </div>
</section>
<script>
// EDIT START TIMES HERE: start is the number of seconds into the video.
// Examples: start: 0 = beginning; start: 41 = 0:41; start: 90 = 1:30.
// CHANGE THIS ONE LINE: "twitch" or "meme"
const MODE = "twitch";
const TWITCH_URL = "https://www.twitch.tv/whit_ney_00";

const memes = [
  {title:'Rick Astley — Never Gonna Give You Up', id:'dQw4w9WgXcQ', start:0},
  {title:'Crazy Frog — Axel F', id:'k85mRPqvMbE', start:0},
  {title:'ABBA — Dancing Queen', id:'xFrGuyw1V8s', start:0},
  {title:'Samwell — What What (In the Butt)', id:'fbGkxcY7YFU', start:41}
];
let previous = -1;
function playRandom() {
  let index;
  do { index = Math.floor(Math.random()*memes.length); }
  while (memes.length>1 && index===previous);
  previous=index;
  const meme=memes[index];
  const iframe=document.createElement('iframe');
  iframe.title=meme.title;
  iframe.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  iframe.allowFullscreen=true;
  iframe.referrerPolicy='strict-origin-when-cross-origin';
  iframe.src=`https://www.youtube.com/embed/${meme.id}?autoplay=1&mute=0&playsinline=1&rel=0&start=${meme.start}`;
  document.getElementById('player').replaceChildren(iframe);
  document.getElementById('fallback').href=`https://www.youtube.com/watch?v=${meme.id}&t=${meme.start}s`;
}
const button=document.getElementById('sound');
button.textContent = MODE === 'twitch' ? '🎮 ENTER STREAM' : '🎭 ENTER SITE';
document.querySelector('.hint').textContent = MODE === 'twitch'
  ? 'Click to visit the Twitch stream'
  : 'Click to reveal a random meme';
button.addEventListener('click',()=>{
  button.disabled=true;
  button.textContent='🔊 SOUND ON';
  playRandom();
  setTimeout(()=>{
    document.getElementById('intro').classList.add('hide');
    document.getElementById('reveal').classList.add('show');
  },700);
});
document.getElementById('next').addEventListener('click',playRandom);
</script>
</body>
</html>
